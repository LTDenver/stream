html,body{margin:0;padding:0;width:600px;height:76px;overflow:hidden;background:transparent}
.track{position:absolute;top:0;left:0;display:flex;white-space:nowrap;will-change:transform;animation:scroll var(--dur,8s) linear infinite}
.item{font-family:Tilt,sans-serif;font-size:42px;line-height:76px;height:76px;color:#c8fbff;letter-spacing:2px;padding:0 40px;text-shadow:0 0 2px #e9feff,0 0 6px #5ef2ff,0 0 12px #14e6ff,0 0 22px #00c8ff,0 0 34px rgba(0,180,255,.6)}
/* right-to-left: track moves left by one item-width, then repeats */
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--w)))}}
</style></head><body>
<div class="track" id="t"></div>
<script>
// URL options:  ?text=Your+message&speed=120&dir=left&size=42&color=5ef2ff&w=600&h=76
const q=new URLSearchParams(location.search);
const TEXT=q.get('text')||"Stream Starting Soon............";
const SPEED=+q.get('speed')||120;                 // pixels per second
const DIR=(q.get('dir')||'left').toLowerCase();    // left = right-to-left, right = left-to-right
const SIZE=+q.get('size')||42;
const W=+q.get('w')||600, H=+q.get('h')||76;
const C='#'+(q.get('color')||'5ef2ff').replace('#','');
document.documentElement.style.cssText=`width:${W}px;height:${H}px`;
document.body.style.cssText=`width:${W}px;height:${H}px`;
const t=document.getElementById('t');
function build(){
  t.innerHTML='';
  const probe=document.createElement('span');probe.className='item';probe.textContent=TEXT;
  probe.style.fontSize=SIZE+'px';probe.style.lineHeight=H+'px';probe.style.height=H+'px';
  probe.style.textShadow=`0 0 2px #e9feff,0 0 6px ${C},0 0 12px ${C},0 0 22px ${C},0 0 34px ${C}99`;
  t.appendChild(probe);
  const w=probe.getBoundingClientRect().width;
  const copies=Math.ceil(W/w)+2;
  for(let i=1;i<copies;i++) t.appendChild(probe.cloneNode(true));
  t.style.setProperty('--w',w+'px');
  t.style.setProperty('--dur',(w/SPEED)+'s');
  t.style.animationDirection = DIR==='right' ? 'reverse' : 'normal';
}
(document.fonts?document.fonts.ready:Promise.resolve()).then(build);
</script></body></html>
